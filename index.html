function lessonHint(type,l){if(type==='plan')return 'Zeichnung, 3D-Vorstellung und Planübung';if(type==='math'||type==='geometry')return 'Rechenweg und Praxisbeispiel';if(['water','hot','waste','gas'].includes(type))return 'Anlage im Gebäude verfolgen';return 'Grundlage + interaktive Anwendung'}
function openLesson(i){state.lesson=i;state.page='lesson';render()}
function lessonPage(){const s=semesters.find(x=>x.n===state.sem),m=s.subjects[state.subject],title=m[3][state.lesson];const content=lessonContent(m[2],title,m[0]);shell(`<button class="back" onclick="state.page='subject';render()">← ${m[0]}</button><div class="eyebrow">${state.sem}. Semester · ${m[0]}</div><h2 class="page-title">${title}</h2><p class="sub">Nicht auswendig lernen: zuerst verstehen, dann erkennen und anwenden.</p><div class="lesson-wrap"><section class="learn-card"><h3>1 · Verstehen</h3>${content.text}<div class="callout"><b>Praxisbezug</b><br>${content.practice}</div>${content.formula?`<div class="formula">${content.formula}</div>`:''}<h3 style="margin-top:18px">2 · Merken</h3><ul>${content.points.map(x=>`<li>${x}</li>`).join('')}</ul><div class="warning">Normative Werte, Mindestmasse, Rohrdimensionen oder Farbkennzeichnungen werden nur dann als verbindlich gezeigt, wenn sie in der passenden Lehr-/Normgrundlage bestätigt sind.</div></section><section class="visual-card"><h3>3 · Visuell</h3><div class="visual">${visualFor(m[2],title)}</div><div class="actions"><button class="btn" onclick="animateVisual(this)">▶ Animation</button><button class="btn green" onclick="go('calculators')">∑ Rechner</button></div><div class="legend"><span>Realität → System → Plan</span><span>Tippen/Animation</span></div><div class="quiz">${miniQuiz(m[2],title)}</div></section></div>`)}
function lessonContent(type,title,subject){let text=`<p><b>${title}</b> gehört zu ${subject}. In dieser Lektion wird der Zusammenhang in kleinen Schritten aufgebaut und direkt mit der Arbeit eines Gebäudetechnikplaners Sanitär verbunden.</p>`;let practice='Überlege zuerst, wo du dieses Thema an unserem Einfamilienhaus sehen oder messen würdest.';let points=['Begriff sicher erklären','im Plan oder Gebäude erkennen','typischen Fehler unterscheiden','Ergebnis auf Plausibilität prüfen'];let formula='';
if(title.includes('Multiplikation')){text='<p>Multiplizieren bedeutet, eine Zahl oder einen Ausdruck mit einem Faktor zu vervielfachen. Beispiel: <b>4 Rohrstücke × 1.20 m = 4.80 m</b>. Das ist nicht Addition zweier verschiedener Längen, sondern dieselbe Länge wird viermal genommen.</p>';practice='Vier identische Rohrstücke mit je 1.20 m werden benötigt. Wie gross ist die Gesamtlänge?';formula='4 × 1.20 m = 4.80 m';points=['Faktor × Faktor = Produkt','Einheiten sauber mitführen','bei Variablen wird das Multiplikationszeichen oft weggelassen','Ergebnis überschlagen'];}
else if(title.includes('Planmassstab')||title.includes('Massstab')){text='<p>Ein Massstab verbindet die Länge im Plan mit der Länge in Wirklichkeit. Bei 1:50 entspricht 1 cm im Plan 50 cm in Wirklichkeit.</p>';practice='Miss eine Strecke im Grundriss und rechne sie in die reale Raumlänge um.';formula='Plan → Realität: × Massstabszahl';points=['Plan zu Wirklichkeit: vergrössern','Wirklichkeit zu Plan: verkleinern','Einheiten vor dem Rechnen angleichen','Massstab immer mit angeben'];}
else if(title.includes('Isometr')){text='<p>Die isometrische Projektion zeigt einen räumlichen Körper in einer technischen 3D-Darstellung. In Riads Schulunterlagen werden die drei Achsen mit 30°-Richtung und proportionaler Darstellung geübt.</p>';practice='Drehe den Körper gedanklich und übertrage Länge, Breite und Höhe auf die drei Achsen.';points=['drei Raumrichtungen','Proportionen beibehalten','verdeckte Kanten beachten','zum Schluss korrekt vermassen'];}
else if(title.includes('Normalprojek')){text='<p>Bei der Normalprojektion wird ein Körper in mehreren Ansichten dargestellt: Vorderansicht, Seitenansicht und Draufsicht. Die Ansichten müssen zueinander passen.</p>';practice='Vergleiche den 3D-Körper mit Vorder-, Seiten- und Draufsicht.';points=['Vorderansicht festlegen','Draufsicht ableiten','Seitenansicht über Projektion übertragen','Linienarten und Vermassung korrekt einsetzen'];}
else if(type==='waste'){text='<p>Entwässerung wird vom Sanitärapparat bis zur Grundstücksentwässerung als zusammenhängendes System betrachtet. Dazu gehören Anschluss-, Fall-, Sammel- und Grundleitungen sowie die notwendige Lüftung des Entwässerungssystems.</p>';practice='Verfolge im Haus die Strecke vom WC bis zur Grundleitung und danach die Lüftungsführung nach oben.';points=['Abwasserweg nach unten verfolgen','Lüftungsweg nach oben erkennen','Gefälle und Höhen zusammen denken','Schmutz- und Regenwasser nicht verwechseln'];}
else if(type==='water'){text='<p>Kaltwasser wird von der Gebäudeversorgung über Verteilung und Armaturen zu den Entnahmestellen geführt. Planung bedeutet nicht nur Linien zeichnen: Druck, Hygiene, Material, Platz und Zugänglichkeit müssen zusammenpassen.</p>';practice='Starte beim Hausanschluss und verfolge die Versorgung bis Küche oder Waschtisch.';points=['Versorgungsweg verstehen','Armaturenfunktion erkennen','Leitungsführung koordinieren','Hygiene in der Planung berücksichtigen'];}
else if(type==='hot'){text='<p>Warmwasser verbindet Trinkwassertechnik mit Wärmelehre. Erzeugung, Speicherung, Verteilung und gegebenenfalls Zirkulation beeinflussen Komfort, Hygiene und Energieverbrauch.</p>';practice='Verfolge den Weg vom Warmwassererzeuger bis zum entferntesten Verbraucher.';points=['Kaltwasser und Warmwasser unterscheiden','Temperatur und Wärmeverluste verstehen','Zirkulation als eigenes System erkennen','Energiebedarf plausibilisieren'];}
else if(type==='flow'){formula='Q = v · A';text='<p>Volumenstrom Q, Strömungsgeschwindigkeit v und Rohrquerschnitt A hängen zusammen. Wird bei gleichem Volumenstrom der Querschnitt kleiner, muss die Geschwindigkeit steigen.</p>';practice='Verändere gedanklich den Rohrdurchmesser und beobachte, was mit der Geschwindigkeit passiert.';points=['Q = Volumen pro Zeit','A = Rohrquerschnitt','v = Strömungsgeschwindigkeit','Einheiten vor Berechnung prüfen'];}
else if(type==='geometry'){text='<p>Geometrie braucht Riad zum Messen, Zeichnen, Dimensionieren und für Flächen- oder Volumenberechnungen im Gebäude.</p>';practice='Nutze einen Raum, Schacht oder Rohrquerschnitt als reale Geometrieaufgabe.';points=['Skizze erstellen','Gegeben/Gesucht notieren','passende Formel wählen','Einheiten kontrollieren'];}
return{text,practice,points,formula}}
function visualFor(type,title){if(title.includes('Multiplikation'))return `<svg viewBox="0 0 600 300"><g font-family="sans-serif"><text x="300" y="42" fill="#b9c7da" text-anchor="middle" font-size="20">4 gleiche Rohrstücke</text>${[0,1,2,3].map(i=>`<g transform="translate(${65+i*125},105)"><rect width="95" height="26" rx="13" fill="#3aa2ff"/><text x="47" y="68" fill="#fff" text-anchor="middle" font-size="18">1.20 m</text></g>`).join('')}<text x="300" y="245" fill="#fff" text-anchor="middle" font-size="28" font-weight="700">4 × 1.20 m = 4.80 m</text></g></svg>`;
if(type==='plan')return `<svg viewBox="0 0 600 320"><g id="vshape" transform="translate(300 160)"><path d="M-120 40 L0 105 L125 35 L5-30 Z" fill="#20344d" stroke="#81bfff" stroke-width="3"/><path d="M-120 40 V-70 L5-135 V-30" fill="#16273b" stroke="#81bfff" stroke-width="3"/><path d="M5-135 L125-65 V35" fill="#1b2d43" stroke="#81bfff" stroke-width="3"/><path d="M-120-70 L0-5 L125-65" fill="#29415e" stroke="#81bfff" stroke-width="3"/></g><text x="300" y="302" text-anchor="middle" fill="#aabbd0">3D-Körper → technische Ansichten</text></svg>`;
if(type==='waste')return houseSvg(['waste','vent']);if(type==='water')return houseSvg(['cold']);if(type==='hot')return houseSvg(['hot','cold']);if(type==='gas')return houseSvg(['gas']);if(type==='flow'||type==='sizing')return `<svg viewBox="0 0 600 300"><defs><linearGradient id="w"><stop stop-color="#55c7ff"/><stop offset="1" stop-color="#1e7dcc"/></linearGradient></defs><path d="M50 150 H550" stroke="#405369" stroke-width="70" stroke-linecap="round"/><path class="flowline" d="M65 150 H535" stroke="url(#w)" stroke-width="48" stroke-linecap="round" stroke-dasharray="26 16"/><text x="300" y="260" fill="#dbe8f7" text-anchor="middle" font-size="24">Q = v × A</text></svg>`;
if(type==='mechanics')return `<svg viewBox="0 0 600 300"><rect x="120" y="210" width="360" height="12" rx="6" fill="#5d6f84"/><path d="M300 210 L270 255 H330Z" fill="#9baabd"/><circle cx="190" cy="175" r="30" fill="#45a3ff"/><circle cx="430" cy="145" r="45" fill="#ffb24a"/><text x="300" y="55" text-anchor="middle" fill="#fff" font-size="22">Kraft · Hebel · Gleichgewicht</text></svg>`;
if(type==='heat')return `<svg viewBox="0 0 600 300"><rect x="90" y="70" width="120" height="170" rx="18" fill="#26374e"/><path d="M150 220 V100" stroke="#ff735e" stroke-width="22" stroke-linecap="round"/><circle cx="150" cy="220" r="32" fill="#ff735e"/><path class="heatwave" d="M300 100 q30-35 60 0t60 0t60 0" stroke="#ffb24a" stroke-width="8" fill="none"/><text x="390" y="185" text-anchor="middle" fill="#fff" font-size="22">Wärmeenergie</text></svg>`;
return `<svg viewBox="0 0 600 300"><rect x="130" y="65" width="340" height="170" rx="24" fill="#14243a" stroke="#35506e" stroke-width="3"/><path class="pulse" d="M170 190 L230 190 L265 105 L315 220 L350 145 L430 145" stroke="#38d991" stroke-width="9" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="300" y="45" text-anchor="middle" fill="#d8e4f2" font-size="21">${title}</text></svg>`}
function houseSvg(layers=['waste','vent','cold','hot','rain']){let show=k=>layers.includes(k);return `<svg viewBox="0 0 700 450"><g stroke="#54657a" stroke-width="4" fill="#111c2b"><path d="M120 180 L350 55 L580 180 V390 H120Z"/><path d="M120 180 H580"/><path d="M120 285 H580"/><path d="M350 55 V390" opacity=".3"/><rect x="160" y="205" width="70" height="55" rx="6" fill="#1f3148"/><rect x="450" y="205" width="80" height="55" rx="6" fill="#1f3148"/><rect x="160" y="310" width="100" height="55" rx="6" fill="#1f3148"/></g>${show('waste')?`<g stroke="#9da9b5" stroke-width="14" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M195 240 H300 V350 H500"/><path d="M490 245 H420 V350"/><path d="M200 340 H300"/></g>`:''}${show('vent')?`<path d="M300 350 V115" stroke="#b9c1ca" stroke-width="12" fill="none" stroke-linecap="round"/><path d="M300 115 V70" stroke="#b9c1ca" stroke-width="10"/><text x="315" y="92" fill="#cfd7df" font-size="14">Entwässerungslüftung</text>`:''}${show('cold')?`<g stroke="#3da4ff" stroke-width="8" fill="none" stroke-linecap="round"><path d="M90 370 H180 V330 H205"/><path d="M180 330 V235 H195"/><path d="M180 235 V215 H485"/></g>`:''}${show('hot')?`<g stroke="#ff655f" stroke-width="8" fill="none" stroke-linecap="round"><path d="M230 350 H260 V250 H485"/><path d="M260 250 H195"/></g>`:''}${show('rain')?`<g stroke="#5ed8e6" stroke-width="7" fill="none"><path d="M575 178 V390"/><path d="M575 390 H640"/></g>`:''}<text x="350" y="425" fill="#97a8bd" text-anchor="middle" font-size="15">Technische Lernansicht – nicht als Material-/Normfarbvorgabe</text></svg>`}
function animateVisual(btn){const v=btn.closest('.visual-card').querySelector('.visual');v.animate([{filter:'brightness(1)'},{filter:'brightness(1.35)'},{filter:'brightness(1)'}],{duration:900});const g=v.querySelector('#vshape');if(g)g.animate([{transform:'translate(300px,160px) rotate(0deg)'},{transform:'translate(300px,160px) rotate(10deg)'},{transform:'translate(300px,160px) rotate(0deg)'}],{duration:1000});}
function miniQuiz(type,title){let q='Was ist hier der wichtigste erste Schritt?',a=['Werte raten','Situation/Plan verstehen','sofort Ergebnis abschreiben'],ok=1;if(title.includes('Multiplikation')){q='Welche Rechnung ist Multiplikation?';a=['120 + 80 = 200','4 × 1.20 = 4.80','200 − 80 = 120'];ok=1}if(title.includes('Planmassstab')){q='Plan → Wirklichkeit bei 1:50?';a=['durch 50','mit 50 multiplizieren','immer +50'];ok=1}return `<div class="q"><b>${q}</b>${a.map((x,i)=>`<button onclick="quizAnswer(this,${i===ok})">${x}</button>`).join('')}<div class="feedback"></div></div>`}
function quizAnswer(b,ok){const q=b.parentElement;q.querySelectorAll('button').forEach(x=>x.disabled=true);b.classList.add(ok?'ok':'bad');q.querySelector('.feedback').textContent=ok?'Richtig.':'Noch nicht. Schau die Erklärung oben nochmals an.'}
function housePage(){shell(`<div class="eyebrow">Projekt Einfamilienhaus</div><h2 class="page-title">🏠 Hausbau A–Z</h2><p class="sub">Vom ersten Plan bis zum Betrieb. Im Rohbau lassen sich die Sanitärsysteme einzeln verfolgen.</p><h3>Sanitär im Rohbau</h3><div class="house-controls">${[['waste','Abwasser'],['vent','Lüftung über Dach'],['cold','Kaltwasser'],['hot','Warmwasser'],['rain','Regenwasser']].map(([k,l])=>`<button class="toggle ${state.houseLayers[k]?'on':''}" onclick="state.houseLayers.${k}=!state.houseLayers.${k};render()">${l}</button>`).join('')}</div><div class="visual house-svg">${houseSvg(Object.keys(state.houseLayers).filter(k=>state.houseLayers[k]))}</div><div class="warning" style="margin-top:10px">Die dargestellten Farben dienen hier nur zur Lerntrennung der Systeme. Reale Rohrmaterialien und normative Plan-/Kennfarben werden separat und quellenbasiert behandelt.</div><h2 class="section-title">Bauablauf</h2><div class="lesson-list">${housePhases.map((p,i)=>`<div class="lesson"><div class="n">${i+1}</div><div><b>${p}</b><small>${phaseHint(p)}</small></div></div>`).join('')}</div>`)}
function phaseHint(p){if(p.includes('Grundleit'))return 'Sanitär: Lage, Höhen, Schächte und spätere Anschlüsse früh koordinieren.';if(p.includes('Hausein'))return 'Sanitär: Hauseinführungen und Anschlussbereiche festlegen.';if(p.includes('Rohinstallation'))return 'Sanitärleitungen, Befestigungen, Schächte und Schnittstellen kontrollieren.';if(p.includes('Vorwänd'))return 'Montageelemente, Anschlusspunkte und Platzbedarf.';if(p.includes('Prüf'))return 'Anlage kontrollieren, dokumentieren und für Inbetriebnahme vorbereiten.';return 'Was passiert auf dem Bau – und was muss der Sanitärplaner dabei wissen?'}
function calcPage(){shell(`<div class="eyebrow">Werkzeugkasten</div><h2 class="page-title">∑ Rechner</h2><p class="sub">Alle wichtigen Grundrechner in einer Spalte. Jeder zeigt Formel und Rechenweg.</p><div class="calc-list">${calcDefs.map((c,i)=>calcCard(c,i)).join('')}</div>`);setTimeout(bindCalcs,0)}
function calcCard(c,i){return `<div class="calc" data-type="${c[2]}"><span class="badge">${c[0]}</span><h3>${c[1]}</h3>${calcFields(c[2])}<div class="result"><strong>–</strong><div class="steps">Werte eingeben.</div></div></div>`}
function calcFields(t){const f=(id,l,v='')=>`<div class="field"><label>${l}</label><input data-id="${id}" type="number" step="any" value="${v}"></div>`;if(t==='unit')return `<div class="fields">${f('x','Wert',1)}<div class="field"><label>von</label><select data-id="from"><option>mm</option><option>cm</option><option selected>m</option></select></div><div class="field"><label>nach</label><select data-id="to"><option>mm</option><option selected>cm</option><option>m</option></select></div></div>`;if(t==='scale')return `<div class="fields">${f('x','Planlänge [cm]',2)}${f('m','Massstab 1 :',50)}</div>`;if(t==='area')return `<div class="fields">${f('a','Länge [m]',4)}${f('b','Breite [m]',3)}</div>`;if(t==='volume')return `<div class="fields">${f('a','Länge [m]',4)}${f('b','Breite [m]',3)}${f('c','Höhe [m]',2.5)}</div>`;if(t==='slope')return `<div class="fields">${f('l','Leitungslänge [m]',5)}${f('p','Gefälle [%]',2)}</div>`;if(t==='circle')return `<div class="fields">${f('d','Innendurchmesser [mm]',50)}</div>`;if(t==='flow')return `<div class="fields">${f('v','Geschwindigkeit [m/s]',1)}${f('d','Innendurchmesser [mm]',20)}</div>`;if(t==='velocity')return `<div class="fields">${f('q','Volumenstrom [l/s]',0.3)}${f('d','Innendurchmesser [mm]',20)}</div>`;if(t==='pressure')return `<div class="fields">${f('h','Wassersäule [m]',10)}${f('rho','Dichte [kg/m³]',1000)}</div>`;if(t==='heat')return `<div class="fields">${f('m','Wassermasse [kg]',100)}${f('dt','Temperaturdifferenz [K]',40)}</div>`;if(t==='power')return `<div class="fields">${f('e','Energie [kWh]',10)}${f('t','Zeit [h]',2)}</div>`;if(t==='percent')return `<div class="fields">${f('g','Grundwert',500)}${f('p','Prozent [%]',12)}</div>`;}
function bindCalcs(){document.querySelectorAll('.calc').forEach(c=>{c.querySelectorAll('input,select').forEach(x=>x.addEventListener('input',()=>runCalc(c)));runCalc(c)})}
function val(c,id){return parseFloat(c.querySelector(`[data-id="${id}"]`)?.value||0)}
function runCalc(c){let t=c.dataset.type,r='',s='';if(t==='unit'){let fac={mm:.001,cm:.01,m:1},x=val(c,'x'),from=c.querySelector('[data-id=from]').value,to=c.querySelector('[data-id=to]').value;r=x*fac[from]/fac[to];s=`${x} ${from} × ${fac[from]} m/${from} ÷ ${fac[to]} m/${to}`;r+=` ${to}`}
if(t==='scale'){let x=val(c,'x'),m=val(c,'m');r=(x*m/100).toFixed(3)+' m';s=`${x} cm × ${m} = ${x*m} cm = ${(x*m/100).toFixed(3)} m`}
if(t==='area'){let a=val(c,'a'),b=val(c,'b');r=(a*b).toFixed(3)+' m²';s=`A = a × b = ${a} × ${b}`}
if(t==='volume'){let a=val(c,'a'),b=val(c,'b'),d=val(c,'c');r=(a*b*d).toFixed(3)+' m³';s=`V = a × b × h = ${a} × ${b} × ${d}`}
if(t==='slope'){let l=val(c,'l'),p=val(c,'p'),dh=l*p/100;r=(dh*1000).toFixed(1)+' mm';s=`Δh = L × i = ${l} m × ${p/100} = ${dh.toFixed(4)} m`}
if(t==='circle'){let d=val(c,'d')/1000,A=Math.PI*d*d/4;r=(A*1e6).toFixed(1)+' mm²';s=`A = π × d² / 4`}
if(t==='flow'){let v=val(c,'v'),d=val(c,'d')/1000,A=Math.PI*d*d/4,Q=v*A;r=(Q*1000).toFixed(3)+' l/s';s=`Q = v × A; A = π × d²/4`}
if(t==='velocity'){let Q=val(c,'q')/1000,d=val(c,'d')/1000,A=Math.PI*d*d/4,v=Q/A;r=v.toFixed(3)+' m/s';s=`v = Q / A; Q = ${val(c,'q')} l/s = ${Q} m³/s`}
if(t==='pressure'){let h=val(c,'h'),rho=val(c,'rho'),p=rho*9.81*h;r=(p/100000).toFixed(3)+' bar';s=`p = ρ × g × h = ${rho} × 9.81 × ${h} Pa`}
if(t==='heat'){let m=val(c,'m'),dt=val(c,'dt'),kJ=m*4.18*dt;r=(kJ/3600).toFixed(3)+' kWh';s=`Q = m × c × ΔT = ${m} × 4.18 × ${dt} kJ`}
if(t==='power'){let e=val(c,'e'),tt=val(c,'t');r=(e/tt).toFixed(3)+' kW';s=`P = E / t = ${e} / ${tt}`}
if(t==='percent'){let g=val(c,'g'),p=val(c,'p');r=(g*p/100).toFixed(2);s=`W = G × p/100 = ${g} × ${p}/100`}
c.querySelector('.result strong').textContent=r;c.querySelector('.steps').textContent=s}
function examPage(){let qs=[['Was zeigt die Normalprojektion?',['Nur eine 3D-Ansicht','Vorder-, Seiten- und Draufsicht','Nur den Grundriss'],1],['Bei Massstab 1:50 misst eine Linie 2 cm. Realität?',['1 m','50 m','25 cm'],0],['Welche Rechnung ist Multiplikation?',['4 × 1.2','4 + 1.2','4 − 1.2'],0],['Wozu dient die Entwässerungslüftung?',['Sie gehört zur Belüftung des Entwässerungssystems','Sie erwärmt Trinkwasser','Sie ersetzt die Kaltwasserleitung'],0],['Q = v × A verbindet…',['Volumenstrom, Geschwindigkeit, Querschnitt','Temperatur, Masse, Zeit','Preis, Menge, Rabatt'],0]];shell(`<div class="eyebrow">QV & Lernkontrolle</div><h2 class="page-title">✓ Prüfungscenter</h2><p class="sub">Kurzer gemischter Test. Später kann jede Fachgruppe eigene Tests erhalten.</p><div class="quiz">${qs.map((q,i)=>`<div class="q"><b>${i+1}. ${q[0]}</b>${q[1].map((a,j)=>`<button onclick="quizAnswer(this,${j===q[2]})">${a}</button>`).join('')}<div class="feedback"></div></div>`).join('')}</div>`)}
render();
</script></body></html>
