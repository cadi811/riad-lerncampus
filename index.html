<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#090d11">
<title>Hausbau A–Z · Prüfungslernapp</title>
<style>
:root{
 --bg:#090d11;--panel:#111820;--panel2:#171f28;--line:#28343f;--line2:#3b4a57;
 --text:#f5f7f9;--sub:#c4ced7;--muted:#81909c;--accent:#59bae5;--accent2:#9bdcf6;
 --green:#70d3a2;--amber:#deb861;--red:#e77b7b;--radius:15px
}
*{box-sizing:border-box}
html{background:var(--bg);scroll-behavior:smooth}
body{margin:0;color:var(--text);font:15px/1.56 Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:radial-gradient(circle at 12% -10%,rgba(89,186,229,.07),transparent 31%),linear-gradient(180deg,#090d11,#0b1015 48%,#090c10)}
button,input{font:inherit}button{cursor:pointer}
#app{max-width:1280px;margin:auto;padding:22px 22px 118px}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:18px;padding:4px 0 18px;border-bottom:1px solid var(--line)}
.brand{font-weight:790;letter-spacing:.015em}.brand small{display:block;color:var(--muted);font-size:12px;font-weight:520;margin-top:2px}
.status{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.badge{padding:6px 10px;border:1px solid var(--line);border-radius:999px;color:var(--sub);font-size:12px;background:rgba(255,255,255,.015)}
h1{font-size:clamp(34px,5vw,58px);letter-spacing:-.045em;line-height:1.02;margin:40px 0 12px;max-width:980px}
h2{font-size:21px;letter-spacing:-.02em;margin:30px 0 14px}
h3{font-size:16px;margin:0 0 8px}
p{margin:0 0 12px}.lead{font-size:17px;line-height:1.65;color:var(--sub);max-width:900px}.muted{color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:14px}.card{background:linear-gradient(180deg,rgba(255,255,255,.018),transparent),var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:18px}
.click{cursor:pointer;transition:.16s}.click:hover{transform:translateY(-1px);border-color:var(--line2);background:var(--panel2)}
.s4{grid-column:span 4}.s5{grid-column:span 5}.s6{grid-column:span 6}.s7{grid-column:span 7}.s8{grid-column:span 8}.full{grid-column:1/-1}
.kicker{color:var(--accent);font-size:11px;font-weight:780;text-transform:uppercase;letter-spacing:.12em;margin-bottom:8px}
.metric{font-size:30px;font-weight:820;letter-spacing:-.03em}.metric small{font-size:13px;color:var(--muted);font-weight:600}
.progress{height:6px;background:#1c2630;border-radius:99px;overflow:hidden;margin-top:12px}.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2))}
.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:20px}.primary,.secondary,.ghost,.back{border-radius:10px;padding:10px 14px;border:1px solid var(--line);font-weight:700}
.primary{background:var(--accent);border-color:var(--accent);color:#061116}.secondary{background:#17212a;color:var(--text)}.ghost,.back{background:transparent;color:var(--sub)}
.bottom{position:fixed;z-index:40;left:0;right:0;bottom:0;background:rgba(7,10,13,.94);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-top:1px solid var(--line);padding:7px 12px calc(7px + env(safe-area-inset-bottom))}
.nav{max-width:860px;margin:auto;display:grid;grid-template-columns:repeat(6,1fr);gap:5px}.nav button{min-height:56px;background:transparent;color:#8795a1;border:1px solid transparent;border-radius:10px;font-size:10px;font-weight:700;padding:6px 3px}.nav button b{display:block;font-size:17px;line-height:1;margin-bottom:3px}.nav button.active{color:white;background:rgba(89,186,229,.1);border-color:#273c49}.nav button.active b{color:var(--accent)}
.timeline{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.phase{display:flex;gap:14px;align-items:flex-start;padding:15px;background:var(--panel);border:1px solid var(--line);border-radius:13px;cursor:pointer;transition:.15s}.phase:hover{border-color:var(--line2)}.phase.done{border-color:#31543f}
.num{width:40px;height:40px;flex:0 0 40px;display:grid;place-items:center;border-radius:11px;background:#0d1217;border:1px solid var(--line);font-size:12px;font-weight:800;color:var(--accent)}.phase.done .num{color:var(--green);border-color:#31543f}.phase .title{font-weight:760}.phase .desc{font-size:12px;color:var(--muted);margin-top:3px}.chapter{grid-column:1/-1;margin:20px 0 2px;color:var(--sub);font-size:13px;font-weight:800;letter-spacing:.06em;text-transform:uppercase}
.search{width:100%;padding:12px 13px;border:1px solid var(--line);border-radius:10px;background:#0c1116;color:white;outline:0}.search:focus{border-color:#3b687c}
.lessonHead{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin:20px 0 16px}.lessonIndex{color:var(--accent);font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase}.lessonTitle{font-size:clamp(28px,4vw,44px);font-weight:820;letter-spacing:-.035em;line-height:1.05;margin:7px 0}.lessonSub{color:var(--sub);max-width:850px}
.visual{min-height:390px;border:1px solid var(--line);border-radius:var(--radius);background:linear-gradient(rgba(255,255,255,.016) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.016) 1px,transparent 1px),#080c10;background-size:28px 28px;overflow:hidden;position:relative}.visual svg{width:100%;height:100%;min-height:390px;display:block}
.stageControl{display:flex;align-items:center;gap:12px;padding:13px 14px;border-top:1px solid var(--line);background:#0d1217}.stageControl input{flex:1;accent-color:var(--accent)}.stageName{min-width:180px;text-align:right;color:var(--sub);font-size:12px}
.callout{border-left:3px solid var(--accent);background:#10171e;padding:14px 15px;border-radius:0 10px 10px 0;color:var(--sub)}.callout strong{color:white}.callout.good{border-left-color:var(--green)}.callout.warn{border-left-color:var(--amber)}.callout.red{border-left-color:var(--red)}
.steps{counter-reset:st;margin:0;padding:0}.steps li{list-style:none;position:relative;padding:0 0 16px 40px;color:var(--sub)}.steps li:before{counter-increment:st;content:counter(st);position:absolute;left:0;top:0;width:25px;height:25px;display:grid;place-items:center;border:1px solid var(--line2);border-radius:8px;color:var(--accent);font-size:11px;font-weight:800}.steps li:after{content:"";position:absolute;left:12px;top:29px;bottom:3px;width:1px;background:var(--line)}.steps li:last-child:after{display:none}
.term{display:flex;justify-content:space-between;gap:15px;padding:10px 0;border-bottom:1px solid var(--line)}.term:last-child{border-bottom:0}.term b{min-width:145px}.term span{color:var(--sub)}
.factgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.fact{padding:14px;border:1px solid var(--line);border-radius:12px;background:#0f151b}.fact b{display:block;color:var(--accent);font-size:11px;text-transform:uppercase;letter-spacing:.09em;margin-bottom:5px}
.quizQ{padding:17px;border:1px solid var(--line);border-radius:14px;background:var(--panel);margin-bottom:11px}.quizQ p{font-weight:720}.answers{display:grid;gap:7px}.ans{border:1px solid var(--line);background:#0f151b;color:var(--sub);padding:10px 12px;border-radius:9px;text-align:left}.ans.correct{border-color:#3a7253;background:rgba(112,211,162,.09);color:white}.ans.wrong{border-color:#7d4545;background:rgba(231,123,123,.08);color:white}.feedback{display:none;margin-top:9px;color:var(--sub);font-size:13px}.feedback.show{display:block}
.flashcards{display:grid;grid-template-columns:repeat(3,1fr);gap:11px}.flash{min-height:160px;perspective:900px;cursor:pointer}.flashInner{position:relative;width:100%;height:100%;min-height:160px;transform-style:preserve-3d;transition:.5s}.flash.flip .flashInner{transform:rotateY(180deg)}.front,.backside{position:absolute;inset:0;padding:17px;border:1px solid var(--line);border-radius:14px;background:var(--panel);backface-visibility:hidden}.backside{transform:rotateY(180deg);background:#101922;color:var(--sub)}.front .small{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.1em}.front .big{font-size:18px;font-weight:780;margin-top:20px}
.toggleRow{display:flex;gap:7px;flex-wrap:wrap}.toggleRow button{border:1px solid var(--line);background:#111820;color:var(--muted);padding:8px 10px;border-radius:9px}.toggleRow button.on{color:white;border-color:#356a82;background:rgba(89,186,229,.09)}
.legend{display:flex;gap:12px;flex-wrap:wrap;color:var(--muted);font-size:11px;margin-top:10px}.dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:5px}
.flow{stroke-dasharray:12 10;animation:dash 1s linear infinite}@keyframes dash{to{stroke-dashoffset:-22}}.reveal{animation:reveal .45s ease both}@keyframes reveal{from{opacity:0;transform:translateY(6px)}}.pulse{animation:pulse 1.5s ease-in-out infinite}@keyframes pulse{50%{opacity:.35}}
.examTop{display:flex;justify-content:space-between;align-items:flex-end;gap:16px}.score{font-size:30px;font-weight:820}.scorebar{position:sticky;top:8px;z-index:5;background:rgba(9,13,17,.9);backdrop-filter:blur(12px);padding:10px;border:1px solid var(--line);border-radius:12px;margin:14px 0}
.seq{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.seq button{padding:12px;border-radius:10px;border:1px solid var(--line);background:#10161d;color:var(--sub)}.seq button.picked{border-color:var(--accent);color:white;background:rgba(89,186,229,.09)}.seqResult{margin-top:12px;color:var(--sub)}
.cram{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.cram .item{padding:14px;border:1px solid var(--line);border-radius:12px;background:#0f151b}.cram .item b{display:block;margin-bottom:5px;color:white}.cram .item span{color:var(--sub)}
@media(max-width:900px){.s4,.s5,.s6,.s7,.s8{grid-column:1/-1}.timeline{grid-template-columns:1fr}.flashcards{grid-template-columns:repeat(2,1fr)}.cram{grid-template-columns:1fr}.seq{grid-template-columns:repeat(2,1fr)}}
@media(max-width:620px){#app{padding:16px 12px 108px}.topbar{align-items:flex-start}.status{display:none}h1{margin-top:30px}.factgrid{grid-template-columns:1fr}.flashcards{grid-template-columns:1fr}.nav button{font-size:8.5px}.nav button b{font-size:14px}.stageControl{display:block}.stageControl input{width:100%}.stageName{text-align:left;margin-top:5px}.lessonHead{display:block}.back{margin-bottom:13px}.term{display:block}.term b{display:block;margin-bottom:4px}.examTop{display:block}}
</style>
</head>
<body>
<div id="app"></div>
<div class="bottom"><div class="nav" id="nav"></div></div>
<script>
const PHASES = [{"chapter": "A · Planung", "title": "Projektstart & Bedürfnisse", "subtitle": "Was soll gebaut werden – und was muss das Gebäude leisten?", "simple": "Ganz am Anfang wird noch nicht gebaut. Zuerst wird geklärt, wofür das Gebäude gebraucht wird, welche Räume nötig sind und welche technischen Anlagen dazugehören.", "why": "Wer Anforderungen zu spät klärt, muss später Pläne ändern. Das kostet Zeit, Geld und kann zu Konflikten zwischen Architektur, Tragwerk und Gebäudetechnik führen.", "steps": ["Bedürfnisse der Bauherrschaft erfassen: Nutzung, Räume, Komfort und technische Anforderungen.", "Zuständigkeiten zwischen Architektur, Tragwerk und Fachplanungen klären.", "Früh groben Platzbedarf für Technikräume, Schächte und Leitungswege reservieren.", "Offene Punkte dokumentieren und im Projektteam abstimmen."], "terms": [["Bauherrschaft", "Auftraggeberin bzw. Auftraggeber des Bauprojekts."], ["Nutzung", "Art, wie ein Gebäude oder Raum verwendet wird."], ["Schnittstelle", "Punkt, an dem zwei Gewerke oder Bauteile zusammenpassen müssen."]], "sanitary": "Sanitärplanung beginnt nicht erst beim Rohr. Bereits hier wird über Nassräume, Technikraum, Schächte, Wasseranschluss, Entwässerung und Zugänglichkeit nachgedacht.", "exam": "Warum beginnt die Sanitärplanung schon in der frühen Projektphase?", "mistake": "Zu glauben, man könne zuerst Architektur und Rohbau fertig planen und die Leitungen später einfach irgendwo einzeichnen.", "memory": "Erst Anforderungen klären – dann planen – dann bauen.", "stage": 0}, {"chapter": "A · Planung", "title": "Grundstück & Grundlagen", "subtitle": "Terrain, Lage, Zufahrt, Erschliessung und vorhandene Leitungen verstehen.", "simple": "Bevor ein Haus geplant wird, muss man das Grundstück kennen. Wichtig sind die Geländeform, Höhen, Zufahrt und bestehende Anschlüsse.", "why": "Das Grundstück bestimmt, wo das Gebäude stehen kann und wie Wasser, Abwasser und andere Medien zum Gebäude geführt werden.", "steps": ["Grundstücksplan, Lageplan und vorhandene Projektgrundlagen beschaffen.", "Terrain und Höhenverhältnisse beurteilen.", "Zufahrt, Nachbargebäude und mögliche Einschränkungen beachten.", "Vorhandene Werkleitungen und Anschlusspunkte prüfen."], "terms": [["Terrain", "Bestehende oder geplante Geländeoberfläche."], ["Erschliessung", "Anbindung des Grundstücks an Strasse sowie Versorgungs- und Entsorgungsnetze."], ["Werkleitung", "Leitung ausserhalb des Gebäudes, z. B. Wasser oder Abwasser."]], "sanitary": "Für Sanitär sind besonders der Trinkwasseranschluss, der Entwässerungsanschluss und die Höhenlage der Leitungen wichtig.", "exam": "Nenne drei Angaben zum Grundstück, die für die Gebäudetechnik wichtig sind.", "mistake": "Leitungen dort einzeichnen, wo sie praktisch wären, ohne die echten Anschlusslagen zu prüfen.", "memory": "Das Grundstück gibt Lage, Höhe und Anschlusspunkte vor.", "stage": 0}, {"chapter": "A · Planung", "title": "Vermessung & Geometer", "subtitle": "Aus dem realen Grundstück werden verlässliche Lage- und Höhendaten.", "simple": "Der Geometer misst die Wirklichkeit so genau, dass Planung und Bau auf eindeutige Punkte und Höhen bezogen werden können.", "why": "Ein Grundriss kann geometrisch richtig aussehen und trotzdem in der Realität falsch liegen. Verlässliche Fixpunkte verhindern solche Fehler.", "steps": ["Relevante Lagepunkte und Höhen werden vermessen bzw. aus bestehenden Daten übernommen.", "Fixpunkte und Höhenbezüge werden festgelegt.", "Planung arbeitet mit diesen eindeutigen Bezugspunkten.", "Später wird die geplante Gebäudelage auf dem Grundstück abgesteckt."], "terms": [["Fixpunkt", "Stabiler Bezugspunkt für Lage oder Höhe."], ["Höhenkote", "Angabe einer Höhe bezogen auf einen definierten Bezug."], ["Absteckung", "Übertragen geplanter Punkte und Achsen in die Realität."]], "sanitary": "Bei Entwässerungsleitungen sind Höhen besonders wichtig. Eine Leitung kann im Grundriss richtig liegen und trotzdem auf falscher Höhe liegen.", "exam": "Warum braucht ein Sanitärplaner neben dem Grundriss auch Höhenangaben?", "mistake": "Lage und Höhe verwechseln.", "memory": "Grundriss sagt wo – Höhe sagt auf welcher Ebene.", "stage": 0}, {"chapter": "A · Planung", "title": "Vorprojekt & Koordination", "subtitle": "Architektur, Tragwerk und Gebäudetechnik werden räumlich aufeinander abgestimmt.", "simple": "Im Vorprojekt bekommt das Gebäude seine Form. Jetzt wird entschieden, wo Räume, Schächte, Technikbereiche und wichtige Leitungswege liegen.", "why": "Je früher Platzkonflikte erkannt werden, desto einfacher lassen sie sich lösen.", "steps": ["Grundrisse, Schnitte und Ansichten weiterentwickeln.", "Tragwerk und Fachplanungen melden ihren Platzbedarf.", "Technikräume, Schächte und Haupttrassen koordinieren.", "Nassräume und vertikale Leitungsachsen über mehrere Geschosse vergleichen."], "terms": [["Grundriss", "Horizontale Darstellung eines Geschosses."], ["Schnitt", "Vertikale Darstellung durch das Gebäude."], ["Schacht", "Vertikaler Raum für technische Installationen."]], "sanitary": "Übereinander angeordnete Nassräume und gut platzierte Schächte können Leitungswege vereinfachen. Entscheidend ist aber immer die Gesamtkoordination des Projekts.", "exam": "Warum muss man Sanitärräume nicht nur im Grundriss, sondern auch geschossübergreifend betrachten?", "mistake": "Jedes Geschoss getrennt planen.", "memory": "Grundriss + Schnitt + mehrere Geschosse zusammen denken.", "stage": 1}, {"chapter": "A · Planung", "title": "Bewilligung & Ausführungsplanung", "subtitle": "Aus dem Entwurf werden koordinierte Unterlagen für die Realisierung.", "simple": "Bevor gebaut wird, muss die Planung weit genug entwickelt sein. Wichtige Durchbrüche, Anschlüsse und Leitungswege werden festgelegt.", "why": "Was später in Beton, Wänden oder Decken liegt, muss früh bekannt sein.", "steps": ["Projektunterlagen vervollständigen und koordinieren.", "Erforderliche Bewilligungen und projektspezifische Vorgaben berücksichtigen.", "Ausführungspläne erstellen.", "Durchbrüche, Aussparungen, Einlagen und Anschlusspunkte prüfen."], "terms": [["Ausführungsplan", "Plan mit Informationen für die konkrete Bauausführung."], ["Aussparung", "Geplanter freier Bereich in einem Bauteil."], ["Durchbruch", "Geplante Öffnung durch Wand oder Decke."]], "sanitary": "Steigleitungen, Fallleitungen und Hauseinführungen benötigen passende Öffnungen. Diese sollten nicht erst auf der Baustelle spontan entstehen.", "exam": "Warum müssen Durchbrüche vor dem Erstellen eines Bauteils koordiniert werden?", "mistake": "Nachträgliches Bohren als normale Planungsmethode betrachten.", "memory": "Was durch Beton muss, muss vorher bekannt sein.", "stage": 1}, {"chapter": "B · Baustart & Erdarbeiten", "title": "Baustelleneinrichtung", "subtitle": "Die Baustelle wird organisiert, erschlossen und sicher vorbereitet.", "simple": "Bevor der eigentliche Bau beginnt, braucht die Baustelle Zufahrten, Lagerflächen, Geräte, provisorische Anschlüsse und eine klare Organisation.", "why": "Gute Planung funktioniert nur, wenn Materialien und Personen sicher und zur richtigen Zeit an den richtigen Ort kommen.", "steps": ["Zufahrt und Arbeitsbereiche festlegen.", "Lagerflächen und Gerätepositionen planen.", "Provisorische Versorgung und Entsorgung organisieren.", "Sicherheits- und Logistikabläufe abstimmen."], "terms": [["Baustelleneinrichtung", "Temporäre Infrastruktur der Baustelle."], ["Bauinstallation", "Provisorische Einrichtungen für den Baustellenbetrieb."], ["Logistik", "Organisation von Material-, Geräte- und Personenbewegungen."]], "sanitary": "Auch Fachplaner müssen verstehen, ob vorgesehene Komponenten überhaupt transportiert, eingebracht und montiert werden können.", "exam": "Warum kann Baustellenlogistik für die Fachplanung relevant sein?", "mistake": "Nur an den fertigen Zustand denken.", "memory": "Planung muss auch montierbar sein.", "stage": 1}, {"chapter": "B · Baustart & Erdarbeiten", "title": "Absteckung", "subtitle": "Die geplante Gebäudelage wird in die Realität übertragen.", "simple": "Nun wird auf dem Grundstück markiert, wo das Gebäude wirklich stehen soll.", "why": "Der Aushub und alle folgenden Arbeiten brauchen eindeutige Achsen, Ecken und Höhen.", "steps": ["Gebäudeachsen bzw. relevante Punkte aus dem Plan übertragen.", "Kontrollmasse prüfen.", "Höhenbezüge festlegen.", "Ausführung an den Referenzen ausrichten."], "terms": [["Gebäudeachse", "Geometrische Bezugslinie für Planung und Ausführung."], ["Flucht", "Geradlinige Ausrichtung von Bauteilen oder Punkten."], ["Schnurgerüst", "Mögliche Hilfskonstruktion zur Übertragung von Achsen."]], "sanitary": "Hauseinführungen und Aussenleitungen müssen zur tatsächlich abgesteckten Gebäudelage passen.", "exam": "Was bedeutet Absteckung?", "mistake": "Absteckung mit Aushub verwechseln.", "memory": "Abstecken = Plan auf das Grundstück übertragen.", "stage": 1}, {"chapter": "B · Baustart & Erdarbeiten", "title": "Aushub & Baugrube", "subtitle": "Der Boden wird für Untergeschoss, Fundation und unterirdische Leitungen entfernt.", "simple": "Jetzt wird Erdmaterial entfernt. So entsteht der Raum für alles, was unter dem späteren Gelände liegt.", "why": "Ohne Baugrube können Fundation, Keller, Bodenplatte und viele unterirdische Leitungen nicht erstellt werden.", "steps": ["Erdmaterial entsprechend dem Bauablauf abtragen.", "Baugrube auf die vorgesehenen Höhen bringen.", "Baugrube fachgerecht sichern.", "Wasserverhältnisse und Zugänglichkeit berücksichtigen."], "terms": [["Aushub", "Entfernen von Erdmaterial."], ["Baugrube", "Ausgehobener Bereich für unterirdische Bauteile."], ["Baugrubensicherung", "Massnahmen zur Stabilisierung der Baugrube."]], "sanitary": "Grundleitungen und Hauseinführungen werden jetzt besonders wichtig, weil viele davon später kaum noch zugänglich sind.", "exam": "Welche Bauteile und Leitungen werden durch den Aushub überhaupt erst möglich?", "mistake": "Baugrube nur als 'Loch' betrachten und Höhen sowie Sicherung vergessen.", "memory": "Aushub schafft Raum  app.innerHTML=top()+`<h1>Fachbegriffe lernen</h1><p class="lead">Karte antippen. Erkläre den Begriff zuerst selbst, danach prüfst du die Rückseite.</p>

 <h2>Reihenfolge-Spiel</h2><div class="card"><p><b>Tippe diese Schritte in der richtigen Reihenfolge an:</b></p><div class="seq" id="seq">${["Endmontage","Aushub","Inbetriebnahme","Fundation","Rohinstallation","Rohbau","Planung","Bodenplatte"].sort(()=>Math.random()-.5).map(x=>`<button onclick="pickSeq(this,'${x}')">${x}</button>`).join("")}</div><div class="seqResult" id="seqResult">Start mit dem frühesten Schritt.</div><div class="actions"><button class="secondary" onclick="state.seq=[];learn()">Neu mischen</button></div></div>`;
 nav();
}
function pickSeq(btn,name){
 if(btn.classList.contains("picked"))return;btn.classList.add("picked");state.seq.push(name);
 const right=["Planung","Aushub","Fundation","Bodenplatte","Rohbau","Rohinstallation","Endmontage","Inbetriebnahme"];
 const n=state.seq.length;const res=document.getElementById("seqResult");
 if(state.seq[n-1]!==right[n-1]){res.innerHTML=`<span style="color:var(--red)">Nicht ganz.</span> An Position ${n} gehört <b>${right[n-1]}</b>.`;return}
 if(n===right.length)res.innerHTML=`<span style="color:var(--green)">Perfekt.</span> Die Hauptreihenfolge sitzt.`;
 else res.innerHTML=`<span style="color:var(--green)">Richtig.</span> Jetzt Schritt ${n+1}.`;
}

function cram(){
 state.page="cram";
 const items=[
 ["1. Planung","Bedürfnisse klären → Grundstück/Vermessung → Vorprojekt → Ausführungsplanung."],
 ["2. Baustart","Baustelleneinrichtung → Absteckung → Aushub → Planum."],
 ["3. Unter Terrain","Grundleitungen/Werkleitungen → Fundation → Bodenplatte."],
 ["4. Rohbau","Keller → Wände/Stützen → Decken → Dach."],
 ["5. Hülle","Fenster/Fassade → Gebäude wird wettergeschützt."],
 ["6. Technik","Rohinstallation → Vorwände → Anschlüsse kontrollieren."],
 ["7. Ausbau","Bodenaufbau/Oberflächen → Sanitär-Endmontage."],
 ["8. Abschluss","Umgebung → Prüfung/Inbetriebnahme → Übergabe/Betrieb."],
 ["Prüfungsfrage: Lage?","Wo liegt Bauteil/Leitung im Grundriss?"],
 ["Prüfungsfrage: Höhe?","Welche Kote oder Bezugsebene ist entscheidend?"],
 ["Prüfungsfrage: Zeitpunkt?","Muss es vor Beton, vor Schliessen oder erst später fertig sein?"],
 ["Prüfungsfrage: Schnittstelle?","Was kollidiert möglicherweise mit Tragwerk, Architektur oder anderem Gewerk?"]
 ];
 app.innerHTML=top()+`<h1>15-Minuten-Wiederholung</h1><p class="lead">Kurz vor der Prüfung: zuerst diese Reihenfolge und Denkfragen beherrschen. Danach den Prüfungsmodus starten.</p>
 <div class="cram">${items.map(x=>`<div class="item"><b>${x[0]}</b><span>${x[1]}</span></div>`).join("")}</div>
 <div class="actions"><button class="primary" onclick="go('exam')">Prüfung starten</button><button class="secondary" onclick="go('phases')">Unsichere Phase öffnen</button></div>`;
 nav();
}

function exam(){
 state.page="exam";state.score=0;state.answered={};
 app.innerHTML=top()+`<div class="examTop"><div><h1>Prüfungstraining</h1><p class="lead">${EXAM.length} Fragen. Nach jeder Antwort siehst du sofort die Begründung.</p></div></div>
 <div class="scorebar"><b>Resultat:</b> <span class="score"><span id="score">0</span> / ${EXAM.length}</span> <span class="muted" id="answeredCount">· 0 beantwortet</span></div>
 ${EXAM.map((q,i)=>`<div class="quizQ"><div class="kicker">Frage ${i+1}</div><p>${q.q}</p><div class="answers">${q.a.map((a,j)=>`<button class="ans" onclick="examAnswer(this,${i},${j})">${a}</button>`).join("")}</div><div class="feedback"></div></div>`).join("")}
 <div class="card"><div class="kicker">Auswertung</div><h3 id="evaluation">Beantworte alle Fragen.</h3><p class="muted" id="evalText">Ziel: nicht nur Reihenfolge auswendig können, sondern die Bauphasen begründen.</p></div>`;
 nav();
}
function examAnswer(btn,i,j){
 if(state.answered[i])return;state.answered[i]=true;const q=EXAM[i],box=btn.closest(".quizQ");
 box.querySelectorAll(".ans").forEach((b,idx)=>{b.disabled=true;if(idx===q.c)b.classList.add("correct")});
 if(j!==q.c)btn.classList.add("wrong");else state.score++;
 const f=box.querySelector(".feedback");f.classList.add("show");f.innerHTML=(j===q.c?`<b style="color:var(--green)">Richtig.</b> `:`<b style="color:var(--red)">Falsch.</b> `)+q.e;
 document.getElementById("score").textContent=state.score;document.getElementById("answeredCount").textContent=`· ${Object.keys(state.answered).length} beantwortet`;
 if(Object.keys(state.answered).length===EXAM.length){
  const pct=Math.round(state.score/EXAM.length*100);let txt=pct>=90?"Sehr sicher":pct>=75?"Gut – einzelne Themen nochmals ansehen":pct>=60?"Grundlagen vorhanden – gezielt wiederholen":"Bauphasen nochmals systematisch lernen";
  document.getElementById("evaluation").textContent=`${txt} · ${pct}%`;document.getElementById("evalText").textContent=`${state.score} von ${EXAM.length} richtig. Wiederhole besonders Fragen zu Reihenfolge, Höhen und Schnittstellen, die falsch waren.`;
 }
}
